
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IncidentHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1120;
            color: #f8fafc;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid #26344d;
            border-radius: 18px;
            background: #131e32;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            margin-bottom: 30px;
            font-size: 25px;
            font-weight: 800;
            color: #67e8f9;
        }

        .logo span {
            color: white;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 9px;
            outline: none;
            background: #0b1527;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #67e8f9;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(110deg, #6366f1, #0891b2);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            padding: 11px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #293a51;
            color: #bae6fd;
            font-size: 13px;
        }

        .register {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #67e8f9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">Incident<span>Hub.</span></div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to manage and track your incidents.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">Sign In →</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create account</a>
        </div>

    </div>

</body>
</html>
